name: Fix Facebook button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-facebook-button.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Facebook card clickable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''\s*<div class="contact-link" role="group" aria-label="Facebook">\s*<span class="contact-icon">f</span><span><span class="contact-label">Facebook</span><span class="contact-value">Nuova Opportunità – Accompagnamento Scolastico</span></span>\s*</div>''')
          replacement = '''
          <a class="contact-link" href="https://www.facebook.com/search/top?q=Nuova%20Opportunit%C3%A0%20Accompagnamento%20Scolastico" target="_blank" rel="noopener" data-contact-type="facebook" data-contact-label="Nuova Opportunità - Accompagnamento Scolastico">
            <span class="contact-icon">f</span><span><span class="contact-label">Facebook</span><span class="contact-value">Nuova Opportunità – Accompagnamento Scolastico</span></span>
          </a>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Facebook block not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rendi cliccabile Facebook"
          git push
# trigger: 2
