name: Run GoatCounter integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-goatcounter.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update analytics
        run: python3 scripts/integrate_goatcounter.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integra analitica GoatCounter"
          git push
