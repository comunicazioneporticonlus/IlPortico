name: Update soft history questions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-soft-history.yml'

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace history questions
        run: python3 -c "from pathlib import Path; import re,base64; p=Path('questions.js'); t=p.read_text(encoding='utf-8'); h=base64.b64decode('').decode(); pat=re.compile(r'  \\{\\n    \"subject\": \"Storia\".*?(?=  \\{\\n    \"subject\": \"Geografia\")',re.S); nt,n=pat.subn(h,t,count=1); assert n==1; p.write_text(nt,encoding='utf-8')"
      - name: Commit changes
        run: |
          if git diff --quiet -- questions.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions.js
          git commit -m "Sostituisci domande di storia con quesiti più soft"
          git push
