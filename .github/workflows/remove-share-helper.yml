name: Remove share helper text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-share-helper.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove helper text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '        <p>Quando la pagina sarà pubblicata online, qui comparirà automaticamente il QR per condividerla.</p>\n'
          if old in text:
              p.write_text(text.replace(old, ''), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rimuovi testo sotto Condividi il quiz"
          git push
