name: Enable random 50-question bank

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/enable-random-50.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update quiz
        run: python3 patch_quiz.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Quiz casuale: 10 domande da banca di 50"
          git push
