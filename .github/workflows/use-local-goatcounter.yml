name: Use local GoatCounter script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-local-goatcounter.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch GoatCounter script to local file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'src="https://gc.zgo.at/count.js"'
          new = 'src="./goatcounter.js"'
          if old not in text:
              raise SystemExit('External GoatCounter script reference not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Usa script GoatCounter locale"
          git push
