name: Update Facebook link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-facebook-button.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Facebook URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'href="https://www.facebook.com/search/top?q=Nuova%20Opportunit%C3%A0%20Accompagnamento%20Scolastico"'
          new = 'href="https://www.facebook.com/share/1BuQmwiP8S/?mibextid=wwXIfr"'
          if old not in text:
              raise SystemExit('Current Facebook link not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aggiorna link Facebook Nuova Opportunità"
          git push
